## FreshWorld 1.1.7 - 5 sections, 23 options.
## Active config: BepInEx/config/sighsorry.FreshWorld.cfg
## Order: save, zones, resources with terrain, resources only, locations.
## FreshWorld saves before restoration; results use the game's normal saves afterward.
## After saving, active player zones are recorded and refreshed before each target attempt or retry.
## Observed player zones and their eight neighbors are excluded from direct targets for the rest of that run.
## This always applies, even at SafeZones=0. Each run starts with a fresh player-zone set.
## Terrain radii and border repair from neighboring targets can still affect excluded zones.
## File edits apply live. An accepted manual request or active run keeps its captured reset settings.
## Existing configurations are not automatically migrated.
## Configuration Manager is optional; its controls edit these same keys and values.

[General]

## Enable automatic runs. Manual freshworld commands remain available when false.
## Displayed as Automatic Runs in Configuration Manager; the cfg key remains Enabled.
## Disabling cancels pending automatic work; accepted manual requests and active runs continue.
## Re-enabling starts a new schedule without catching up on the disabled period.
Enabled = true

## Percentage of eligible generated zones selected for automatic runs only. Integer from 0 to 100.
## The count rounds to the nearest whole zone, with halves rounded up; small sets can round to zero.
## All stages share one selection and retain their protection rules. Later skips are not replaced.
## Each run draws again without history: at 20%, even 5 or 10 runs can leave some zones untouched.
## Never-generated zones and reset zones not yet generated again are excluded from the count and draw.
## With Zones=true, a connected location group counts once if its zone or selected location reset is eligible.
## All members share that draw; skipped zone groups do not receive another draw for location restoration.
## Manual freshworld always processes all eligible zones. Neighboring terrain edits can still cross boundaries.
AutomaticResetPercent = 100

## GameDays uses elapsed game days; DailyTimes uses host-local clock times.
## Set Enabled=false for manual commands only.
Mode = GameDays

## GameDays interval; the first automatic run waits this many game days.
## One normal game day is 30 real minutes (0.5 hours), so 24 days is about 12 hours.
## Sleep, pauses and time changes affect elapsed real time. Must be finite and greater than 0.
GameDayInterval = 24

## DailyTimes schedule as comma-separated HH:mm values in the world host's OS time zone.
## Every automatic run includes all enabled stages. Inactive schedule fields are ignored.
DailyTimes = 05:35,17:35

[Reset]

## Reset generated zones first, including their resources and locations.
## Managed locations and their intersecting sectors reset as one group using ZoneSafeZones.
## One protected sector skips the zone group; selected locations can still use LocationSafeZones afterward.
## The switches and ID lists below control only the extra restoration stages.
Zones = true

## Enable both resource groups in zones retained by base protection.
## With Zones=false, both groups use all generated zones as candidates.
Resources = true

## Exact prefab IDs restored with surrounding terrain before ResourceIds. Empty is allowed.
## Both groups share Resources and ResourceSafeZones; both empty skips resource restoration.
## Use comma-separated unique IDs within each list, without wildcards or command arguments.
TerrainResourceIds = rock4_copper,silvervein

## Terrain radius in metres around TerrainResourceIds only; 0 restores those resources only.
## Zone and location terrain resets are separate. Must be finite and nonnegative.
## Terrain changes can affect building support even when pieces are not directly deleted.
ResourceTerrainRadius = 20

## Exact prefab IDs restored without terrain changes, such as Beech1,Birch1.
## Empty skips this group. IDs listed in both groups are restored once in TerrainResourceIds.
ResourceIds =

## Restore selected locations after resources across their full exterior radius.
## Every intersecting sector must pass LocationSafeZones and independent protections.
## Skipped zone groups are checked separately; successful zone resets are not repeated.
Locations = false

## Exact location IDs, with optional :variant suffixes. Unknown IDs are warned and skipped.
## If none match, this stage is skipped. Use Locations=false instead of an empty list.
LocationIds = Hildir_crypt,Hildir_cave,Hildir_plainsfortress,SunkenCrypt4,Crypt2,Crypt3,Crypt4,MountainCave02,Mistlands_Giant1,Mistlands_Excavation1,Mistlands_DvergrTownEntrance1,Mistlands_DvergrTownEntrance2,Mistlands_DvergrBossEntrance1,CharredFortress,TheHole01,MorkBorg

## Exact location IDs with minimum exterior radii in metres. Each radius must be greater than 0 and at most 512.
## Uses the larger of this value and the resolved native radius. Empty removes explicit entries.
## With Zones=true, these areas use grouped zone reset even when Locations=false or absent from LocationIds.
## For radius restoration, enable Locations and include the ID in LocationIds.
## Managed areas are excluded from separate resource resets. Unknown IDs have no effect.
## This radius covers object origins, not automatically detected mesh bounds.
LocationResetRadii = MWL_AshlandsFort4=40

[Protection]

## SafeZones controls base-marker protection; it cannot disable player-occupied target protection.
## Zone choices: 1 = Marker zone, 2 = 3x3 neighbourhood. Resources and locations also allow 0.
## ZoneSafeZones=0 is invalid and must be changed explicitly; it is not converted or clamped.
## These choices select whole zones, not metre radii. Player-built Pieces are automatic base markers.
ZoneSafeZones = 1

## Protection for both resource groups: 0 = No protection, 1 = Marker zone, 2 = 3x3.
## Only these values are valid. 0 permits restoration inside base zones.
ResourceSafeZones = 0

## Location protection: 0 = No protection, 1 = Marker zone, 2 = 3x3. Only these values are valid.
## Every sector intersecting the location radius is checked; one protected sector skips the whole location.
## 0 can delete player pieces inside selected locations even when ZoneSafeZones blocked the zone stage.
## Player zones and their eight neighbors, absolute, Jotun and enabled EpicLoot protections still apply.
LocationSafeZones = 0

## Exact prefab IDs protected regardless of SafeZones or PieceBlacklist, without a creator requirement.
## Each object's own zone is excluded from direct resets, terrain restoration, and border repairs.
## Observed zones stay protected until the run ends. Native placement can cross zone boundaries.
AlwaysProtectedPrefabs = Player_tombstone

## Comma-separated exact prefab IDs excluded from automatic Piece markers.
## Other Pieces with creator != 0 protect their zones. Empty excludes no Pieces.
## Default fire_pit prevents lone campfires from protecting zones.
## Excluded Pieces can still share protection from other markers in the same zone or range.
## Player_tombstone remains a separate marker unaffected by this list, without the creator requirement.
## All markers, including automatic Pieces and tombstones, require the stage's SafeZones > 0.
PieceBlacklist = fire_pit

[EpicLoot]

## Move these two settings here from [Protection] if using an older cfg.
## Protect unfound EpicLoot treasures and pending treasure controllers in their own zones.
## Also prevent FreshWorld from deleting those objects. EpicLoot is optional.
EpicLootProtection = true

## Protect pending EpicLoot bounty controllers, targets, and their adds in their own zones.
## Neighboring terrain edits can still reach them. EpicLoot is optional.
EpicLootBountyProtection = false

[Path of Valheiman]

## Protect PT_WardenAltar and PT_PowerAltar and their own zones, even with SafeZones=0.
## Includes FreshWorld terrain restoration and direct or recursive deletion.
## Missing altars can be restored manually with freshworld pov; this switch does not repair them.
AltarProtection = true

## Protect active Blight controllers, linked altars, monoliths, and wardens in their own zones.
## Ordinary mobs and azurite veins do not reserve zones by this rule; PoV can replenish them.
## Observed protection lasts until the run ends. PoV still owns event completion and cleanup.
BlightProtection = true

## Use vegetation for natural PT_AzuriteVein instead of PoV's initial and timed natural generation.
## Existing vegetation definitions take priority; otherwise FreshWorld supplies defaults. EWD is optional.
## Zone regeneration creates plain veins. Add PT_AzuriteVein to ResourceIds for retained-zone resource resets.
## Existing veins in or within 6m of a zone suppress azurite placement there, including unloaded veins.
## PoV promotion and Blight spawning remain active. Previous grades and exact positions are not restored.
## Enabling does not move existing veins or clean duplicates. Native 12m building avoidance is not reproduced.
## Disabling restores PoV policy and can start its initial placement if the completion key is absent.
## These options use ServerSync and cfg hot reload; changes wait until current maintenance finishes.
AzuriteVegetation = false
